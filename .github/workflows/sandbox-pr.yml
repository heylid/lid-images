name: sandbox image (pull request)

# Pull requests that touch only docs do not run this workflow.
on:
  pull_request:
    paths:
      - "images/sandbox/**"
      - ".github/workflows/sandbox-*.yml"

concurrency:
  group: sandbox-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only: nothing is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/sandbox
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: lid-sandbox:pr

      - name: Smoke test
        run: images/sandbox/smoke-test.sh lid-sandbox:pr

      - name: Image size
        run: docker image inspect lid-sandbox:pr --format 'image size, bytes{{"\n"}}{{.Size}}'
